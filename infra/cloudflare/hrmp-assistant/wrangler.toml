# HRMP — «مساعد HRMP» عامل الذكاء الاصطناعي الموجَّه (جولة 2026-10-28)
# حساب مستقل للذكاء (المعرف 02fcf95818efed008f495dd6e02c3ef6 — «حساب الشات بوت» بطلب المالك):
# النموذج المجاني عبر ربط Workers AI — بلا مفاتيح داخل الكود إطلاقًا.
# العنوان بعد النشر: https://hrmp-assistant.balbolghol-ai.workers.dev
# النشر: CLOUDFLARE_API_TOKEN=… CLOUDFLARE_ACCOUNT_ID=02fcf95818efed008f495dd6e02c3ef6 npx wrangler deploy
# التحقق: curl https://hrmp-assistant.balbolghol-ai.workers.dev/health

name = "hrmp-assistant"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

# ربط Workers AI — النموذج المجاني داخل الحصة اليومية المجانية (10k neurons/day)
[ai]
binding = "AI"

[vars]
# النموذج الافتراضي: مجاني وسريع — قابل للتغيير عبر wrangler بدون تعديل الكود
ASSISTANT_MODEL = "@cf/meta/llama-3.1-8b-instruct-fp8"
# مضيفو CORS المسموح لهم (البوابة العامة للتطبيق + النطاقات المحلية)
ASSISTANT_ALLOWED_ORIGINS = "hrmp.pages.dev,hrmp.vercel.app,fwms-dg8.pages.dev,fwms.tarikc.workers.dev,localhost:3000,127.0.0.1:3000"
# سقوف الحماية
ASSISTANT_MAX_MESSAGES = "12"
ASSISTANT_MAX_CHARS = "2000"
ASSISTANT_MAX_TOKENS = "400"
